<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ushna Yoga Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="x-icon">
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html"><img src="USNAYOGASTUDIO.png" alt="Ushna Yoga Studio Logo"></a>

      <div class="announcement-bar">
        <div class="ig-logo">
          <a href="https://www.instagram.com/ushna_yoga/"><img src="instagram.png" alt="Instagram"></a>
        </div>

        <div class="announcement-text">
          <span class="announcement-nav">
              <a href="classes.html">HORARIOS</a>
              <a href="estilo.html">ESTILO</a>
              <a href="docentes.html">DOCENTES</a>
              <a href="estudio.html">COMUNIDAD</a>
          </span>
        </div>

        <div class="whatsapp-logo">
          <img src="whatsapp.png" alt="WhatsApp">
        </div>
      </div>
    </header>

    <nav>
      <a class="nav-title">HORARIOS</a>
      <div class="schedule-container">
        <img src="Schedule.png" alt="Class Schedule" class="schedule-image" id="scheduleImage">
      </div>
    </nav>

    <footer>
      <p><a href="https://www.instagram.com/your_instagram_handle">Buenos Aires, Argentina</a></p>
      <p>&copy; 2024</p>
    </footer>

    <!-- Popup Modal -->
    <div id="imageModal" class="modal">
      <span class="close">&times;</span>
      <img class="modal-content" id="modalImage">
    </div>
  </div>

  <script>
    // Get the modal
    const modal = document.getElementById("imageModal");
    const img = document.getElementById("scheduleImage");
    const modalImg = document.getElementById("modalImage");
    const span = document.getElementsByClassName("close")[0];

    // When the user clicks the image, open the modal 
    img.onclick = function() {
      modal.style.display = "block";
      modalImg.src = this.src;
    }

    // When the user clicks on (x), close the modal
    span.onclick = function() { 
      modal.style.display = "none";
    }

    // When the user clicks anywhere outside of the modal, close it
    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }
  </script>
</body>
</html>
